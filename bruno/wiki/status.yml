info:
  name: Agent status
  type: http
  seq: 12

http:
  method: GET
  url: "{{baseUrl}}/api/v1/wiki/status"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("reports isolation", function () {
          expect(res.getStatus()).to.be.oneOf([200, 202]);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Which sandbox confines agent runs on this host, whether runs are blocked,
  and whether the agent has credentials.
