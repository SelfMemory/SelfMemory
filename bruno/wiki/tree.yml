  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Wiki pages per readable scope. Scopes are scaffolded on first use (index.md,
  log.md, promotions.md, and a git repository).
