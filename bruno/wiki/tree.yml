http:
  method: GET
  url: "{{baseUrl}}/api/v1/wiki/tree"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("lists pages", function () {
          expect(res.getStatus()).to.be.oneOf([200, 202]);
