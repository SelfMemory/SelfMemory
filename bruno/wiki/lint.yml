info:
  name: Lint run
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/api/v1/wiki/runs"
  body:
    type: json
    data: |-
      {
        "command": "lint",
        "scope": "project:{{projectId}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("queued", function () {
          expect(res.getStatus()).to.be.oneOf([200, 202]);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  A read-only health report against OKF and scope rules.
