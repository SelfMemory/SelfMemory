# uv workspace root. The library lives in packages/selfmemory (src layout);
# this file holds the dev tooling and shared tool configuration.
[project]
name = "selfmemory-workspace"
version = "0"
requires-python = ">=3.13"
dependencies = ["selfmemory[server]"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/selfmemory"]

[tool.uv.sources]
selfmemory = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.0.0",
    "pytest-mock>=3.14.0",
    "pytest-cov>=6.0.0",
    "pytest-timeout>=2.0.0",
    "responses>=0.25.0",
    "mongomock>=4.3.0",
    "ruff>=0.14.0",
    "import-linter>=2.1",
    "pre-commit>=4.3.0",
    "commitizen>=4.4.0",
    "python-semantic-release>=10.0.0",
]

[tool.ruff]
extend-exclude = ["legacy", "selfmemory-ts"]
line-length = 88
indent-width = 4
target-version = "py313"
src = ["packages/selfmemory/src", "."]

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "W",
    "B",   # flake8-bugbear
    "I",   # isort
    "UP",  # pyupgrade
    "C4",  # flake8-comprehensions
    "PTH", # flake8-use-pathlib
    "SIM", # flake8-simplify
    "RET", # flake8-return
    "TCH", # flake8-type-checking
]
ignore = [
    "E501",   # Line too long, handled by formatter
    "B008",   # Do not perform function calls in argument defaults
    "RET504", # Unnecessary variable assignment before `return` statement
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
# Telemetry must initialise before the MCP SDK and tool modules import.
"packages/selfmemory/src/selfmemory/apps/mcp.py" = ["E402"]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
docstring-code-format = false

# Set the line length limit used by the formatter.
docstring-code-line-length = "dynamic"


# Pytest configuration for test discovery and execution
[tool.pytest.ini_options]
pythonpath = ["."]  # tests/ and scripts/ import from the repo root
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "-ra",
    "--cov=selfmemory",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-report=xml",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
    "network: Tests that require network access",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "semver"
allowed_prefixes = ["Merge", "Revert"]
update_changelog_on_bump = false

# Python Semantic Release v10 configuration
[tool.semantic_release]
commit_parser = "angular"
commit_message = "{version}\n\nAutomatically generated by python-semantic-release"
tag_format = "v{version}"
major_on_zero = false
allow_zero_version = true
build_command = "uv build --package selfmemory"
version_toml = ["packages/selfmemory/pyproject.toml:project.version"]

[tool.semantic_release.branches.main]
match = "(main|master)"
prerelease = false

[tool.semantic_release.commit_parser_options]
allowed_tags = [
    "feat",
    "fix",
    "docs",
    "style",
    "refactor",
    "perf",
    "test",
    "build",
    "ci",
    "chore",
]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

[tool.semantic_release.changelog]
mode = "update"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"

[tool.semantic_release.changelog.environment]
block_start_string = "{%"
block_end_string = "%}"
variable_start_string = "{{"
variable_end_string = "}}"
comment_start_string = "{#"
comment_end_string = "#}"
trim_blocks = false
lstrip_blocks = false
newline_sequence = "\n"
keep_trailing_newline = false
extensions = []
autoescape = true

[tool.semantic_release.remote]
type = "github"

[tool.semantic_release.remote.token]
env = "GH_TOKEN"

# Layer rules (blueprint "Multi-layer architecture"), checked in CI with
# `lint-imports`. Dependencies point downward only.
[tool.importlinter]
root_package = "selfmemory"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Process entry points sit above features, features above platform and kernel"
type = "layers"
layers = [
    "selfmemory.apps",
    "selfmemory.features",
    "selfmemory.platform",
    "selfmemory.kernel",
]

[[tool.importlinter.contracts]]
name = "Wiki domain is pure: no I/O adapters, services, interfaces or frameworks"
type = "forbidden"
source_modules = ["selfmemory.features.wiki.domain"]
forbidden_modules = [
    "selfmemory.features.wiki.adapters",
    "selfmemory.features.wiki.interfaces",
    "selfmemory.features.wiki.service",
    "selfmemory.platform",
    "selfmemory.apps",
    "fastapi",
    "pymongo",
]
